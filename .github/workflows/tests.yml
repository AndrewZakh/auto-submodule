name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-24.04   # ubuntu-latest (26.04) has no Python 3.9
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install --quiet -e ".[dev]"
      - name: Test
        run: python -m pytest -q

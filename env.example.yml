# Sample env.yml for a repository protected by submodule-hook.
# The `submodules:` section is the contract the hook enforces;
# `submodule_hook:` is optional tool tuning (the values below are the defaults).
# Full spec: README.md

submodules:
  # Submodule pinned by a short SHA (prefix comparison, 4..40 hex chars).
  - folder: path/to/submodule_1     # submodule path from the repo root,
                                    # same as in .gitmodules
    commit_sha: "12351adf"          # the commit the submodule must point to
    lookup_branch: master           # protected branch where merges land,
                                    # fetched from submodule_hook.remote
                                    # (default: master)

  # A second submodule pinned by a full SHA in a main-based repository.
  - folder: libs/api-clients
    commit_sha: "9a4c02e44f2b1c7d8e5f6a0b1c2d3e4f5a6b7c8d"
    lookup_branch: main

# Optional tool settings — the whole section may be omitted.
submodule_hook:
  remote: origin       # remote to fetch lookup branches from
  fetch: true          # false / --no-fetch: offline, use existing
                       # remote-tracking refs
  on_error: fail       # "warn": let commits through with a message
                       # (transition period)
  skip_merges: true    # do not act on merge commits (MERGE_HEAD present)
